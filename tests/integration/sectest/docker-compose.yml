# Throwaway stack for tests/integration/secrets.sh. Own project + subnet + name.
name: bastion-sectest

services:
  probe:
    image: alpine/socat:1.8.1.3
    container_name: bastion-sectest-probe
    command: ["-T1", "TCP-LISTEN:9", "SYSTEM:sleep 3600"]
    environment:
      HARMLESS_ENV: not-a-secret
    secrets:
      - test_secret
    networks:
      net:
        ipv4_address: 10.198.0.2

networks:
  net:
    ipam:
      config:
        - subnet: 10.198.0.0/24

secrets:
  test_secret:
    file: ./test_secret
