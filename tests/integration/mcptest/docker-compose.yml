# Throwaway Compose project for the MCP gateway integration test
# (tests/integration/mcp-gateway.sh). Completely separate from the real
# stack-ai project: distinct container names, its own network and volume, and
# NO published host ports - the test client rides the project network, so the
# real gateway's 8811 never matters here. The SearXNG settings template is
# bind-mounted from the real stack-ai config so this exercises the file that
# ships, and the gateway image is built from the real stack-ai Dockerfile.
#
# The gateway token is generated by the test script into ./test_token and
# removed again by the script's cleanup trap.
services:
  searxng:
    # Keep in sync with stack-ai/docker-compose.yml.
    image: searxng/searxng:2026.9.21-df67eb6c2@sha256:1ef964f6dcc811a60e01049717b6e526b25a1c52935350143f04e0ae291b3dbd
    container_name: bastion-mcptest-searxng
    user: "977:977"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../../../stack-ai/config/searxng:/etc/searxng:ro

  mcp-gateway:
    build:
      context: ../../../stack-ai/mcp-gateway
      dockerfile: Dockerfile.mcp-gateway
    image: bastion-mcptest-gateway
    container_name: bastion-mcptest-gateway
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MCP_TOKEN_FILE: /run/secrets/mcp_gateway_token
      # context7_api_key is deliberately NOT mounted: the gateway must work
      # keyless when the optional secret is absent.
      MCP_SEARXNG_URL: http://searxng:8080
      MCP_MEMORY_FILE_PATH: /data/memory.json
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8811"
      TIMEZONE: Europe/Madrid
    secrets:
      - mcp_gateway_token
    volumes:
      - mcp_memory_data:/data

  client:
    image: python:3.13-slim
    container_name: bastion-mcptest-client
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./e2e.py:/e2e.py:ro

secrets:
  mcp_gateway_token:
    file: ./test_mcp_gateway_token

volumes:
  mcp_memory_data:
