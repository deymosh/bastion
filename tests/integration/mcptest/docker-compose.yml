# Throwaway Compose project for the MCP gateway integration test
# (tests/integration/mcp-gateway.sh). Completely separate from the real
# stack-ai project: distinct container names, its own network and volume, and
# NO published host ports - the test client rides the project network, so the
# real gateway's 8811 never matters here. The SearXNG settings template is
# bind-mounted from the real stack-ai config so this exercises the file that
# ships, and the gateway image is built from the real stack-ai Dockerfile.
#
# The gateway token is generated by the test script into ./test_token and
# removed again by the script's cleanup trap.
services:
  searxng:
    # Keep in sync with stack-ai/docker-compose.yml.
    image: searxng/searxng:2026.9.25-d8ae3abd5@sha256:38ed750807fb00c26047e51896b50f83e7843d120d9e65f950770305f62c7111
    container_name: bastion-mcptest-searxng
    user: "977:977"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../../../stack-ai/config/searxng:/etc/searxng:ro

  mcp-gateway:
    build:
      context: ../../../stack-ai/mcp-gateway
      dockerfile: Dockerfile.mcp-gateway
    image: bastion-mcptest-gateway
    container_name: bastion-mcptest-gateway
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MCP_TOKEN_FILE: /run/secrets/mcp_gateway_token
      # context7_api_key and github_token are deliberately NOT mounted: the
      # gateway must work keyless/tokenless when the optional secrets are
      # absent (context7 serves keyless; graphify's PR tools are filtered
      # out entirely, which e2e.py asserts).
      MCP_SEARXNG_URL: http://searxng:8080
      MCP_BM_CONFIG_DIR: /data/memory
      MCP_GRAPHIFY_DIR: /data/graphify
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8811"
      TIMEZONE: Europe/Madrid
    secrets:
      # file-secrets are plain bind mounts outside swarm: the HOST file's
      # permissions carry into the container (the test script chmods it 644),
      # and uid/gid/mode below would never be applied. Short syntax on
      # purpose - nothing here pretends to pin permissions.
      - mcp_gateway_token
    volumes:
      - mcp_memory_data:/data

  client:
    image: python:3.13-slim
    container_name: bastion-mcptest-client
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./e2e.py:/e2e.py:ro

secrets:
  mcp_gateway_token:
    file: ./test_mcp_gateway_token

volumes:
  mcp_memory_data:
