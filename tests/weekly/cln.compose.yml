# Weekly-tier: real Core Lightning image + real Tor image + throwaway regtest
# bitcoind. Driven by tests/weekly/cln-real-config.sh, which mounts a config
# mechanically derived from the real stack-bitcoin/config/cln_config.
#
# Own Compose project, own subnet. Needs lightningd-custom:latest to exist
# (the weekly workflow builds it first; locally: ./bastion build stack-bitcoin).
name: bastion-cln-weekly

services:
  tor:
    build:
      context: ../../stack-network
      dockerfile: Dockerfile.tor
    image: bastion-cln-weekly-tor:latest
    volumes:
      - ${CLN_WEEKLY_DIR:-/tmp/bastion-cln-weekly}:/cfg:ro
      - tordata:/data/.tor
    entrypoint: ["tor", "-f", "/cfg/torrc"]
    healthcheck:
      test: ["CMD", "timeout", "5", "bash", "-c", "cat < /dev/null > /dev/tcp/10.252.0.2/9050"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      net: { ipv4_address: 10.252.0.2 }

  bitcoind:
    image: lncm/bitcoind:v26.0
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0002
      - -rpcuser=bitcoind.user
      - -rpcpassword=bitcoind.pass
      - -rpcbind=0.0.0.0
      - -rpcallowip=10.252.0.0/24
      - -printtoconsole=1
    networks:
      net: { ipv4_address: 10.252.0.3 }

  cln:
    image: lightningd-custom:latest
    environment:
      LIGHTNINGD_NETWORK: regtest
    command: ["--conf=/cfg/cln_config", "--alias=cln-weekly"]
    volumes:
      - ${CLN_WEEKLY_DIR:-/tmp/bastion-cln-weekly}:/cfg:ro
      - clndata:/root/.lightning/regtest
      - tordata:/data/.tor:ro
    depends_on:
      bitcoind: { condition: service_started }
      tor: { condition: service_healthy }
    networks:
      net: { ipv4_address: 10.252.0.10 }

networks:
  net:
    ipam:
      config:
        - subnet: 10.252.0.0/24

volumes:
  tordata:
  clndata:
