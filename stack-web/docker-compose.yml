name: stack-web

services:
  hub:
    image: nginx:alpine
    container_name: hub
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    networks:
      net:
        ipv4_address: 10.40.0.2

networks:
  net:
    name: bastion-web
    ipam:
      config:
        - subnet: 10.40.0.0/24
