name: stack-web

services:
  hub:
    # Pinned by digest (nginx 1.31.5-alpine as of 2026-09-09; tag kept for readability).
    image: nginx:1.31.5-alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    container_name: hub
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    networks:
      net:
        ipv4_address: 10.40.0.2

networks:
  net:
    name: bastion-web
    ipam:
      config:
        - subnet: 10.40.0.0/24
