<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASTION Hub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0b0f14;
    --bg-card: #131920;
    --bg-card-hover: #1a222c;
    --bg-topbar: #10151b;
    --border: #232c37;
    --text: #e8edf2;
    --text-dim: #8493a3;
    --accent: #f7931a;
    --topbar-h: 56px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* --- Top banner: identity + "where am I" + escape hatch, always visible --- */

  #topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    height: var(--topbar-h);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--bg-topbar);
    border-bottom: 1px solid var(--border);
  }

  #brand {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    padding: 6px 4px;
    margin: 0 -4px;
    color: inherit;
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
  }

  #brand:hover, #brand:focus-visible {
    background: var(--bg-card-hover);
  }

  #brand .logo {
    width: 26px;
    height: 26px;
    flex: 0 0 auto;
    display: block;
  }

  #brand .logo svg { width: 100%; height: 100%; display: block; }

  #brand .name {
    font-weight: 700;
    letter-spacing: 0.04em;
    font-size: 15px;
    white-space: nowrap;
  }

  #crumb {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    color: var(--text-dim);
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #crumb .sep { opacity: 0.5; }
  #crumb .section { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }

  #openTab {
    margin-left: auto;
    flex: 0 0 auto;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
  }

  #openTab:hover, #openTab:focus-visible {
    border-color: var(--accent);
    background: var(--bg-card-hover);
  }

  #openTab svg { width: 15px; height: 15px; flex: 0 0 auto; }
  #openTab .label { display: inline; }

  body.in-service #openTab { display: inline-flex; }

  /* --- Home view: the service directory --- */

  #home {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 20px 24px;
  }

  body.in-service #home { display: none; }

  .home-head {
    width: 100%;
    max-width: 900px;
    margin: 0 0 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .home-head h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 0.01em;
  }

  .home-head h1::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 9px;
    border-radius: 2px;
    background: var(--accent);
  }

  .home-head .intro {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
  }

  .grid {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
  }

  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 24px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }

  a.card:hover,
  a.card:focus-visible {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  a.card .icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }

  a.card .icon svg {
    width: 100%;
    height: 100%;
  }

  a.card .name {
    font-size: 15px;
    font-weight: 600;
  }

  a.card .desc {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  a.card { position: relative; }

  a.card .ext {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 14px;
    height: 14px;
    color: var(--text-dim);
  }

  a.card .ext svg { width: 100%; height: 100%; }

  footer {
    margin-top: 40px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }

  footer code {
    color: var(--text);
  }

  /* --- Service view: the embedded panel fills the rest of the viewport --- */

  #frameWrap {
    display: none;
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }

  body.in-service #frameWrap { display: block; }

  #serviceFrame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
  }

  #frameStatus {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 14px;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  #frameStatus.hidden { opacity: 0; }

  #frameStatus .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 520px) {
    #topbar { gap: 6px; padding: 0 10px; }
    /* The wordmark only competes for space with the crumb + open-tab button
       in a service view - the home screen always has room for it. */
    body.in-service #brand .name { display: none; }
    #openTab .label { display: none; }
    #openTab { padding: 8px; }
  }
</style>
</head>
<body>

<nav id="topbar">
  <button id="brand" type="button" aria-label="Back to Bastion home">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8 51 15v15c0 12-7.8 21.8-19 27C20.8 51.8 13 42 13 30V15z" fill="var(--accent)"/>
        <path d="M34 16 22 35h9l-2 13 13-20h-9z" fill="var(--bg)"/>
      </svg>
    </span>
    <span class="name">BASTION</span>
  </button>
  <div id="crumb"></div>
  <a id="openTab" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    <span class="label">Open in new tab</span>
  </a>
</nav>

<main id="home">
  <div class="home-head">
    <h1>Services</h1>
    <p class="intro">Sovereign Infrastructure, Operations &amp; AI</p>
  </div>
  <div class="grid" id="grid"></div>
  <footer>
    Connected as <code id="host"></code>
  </footer>
</main>

<div id="frameWrap">
  <div id="frameStatus"><span class="spinner" aria-hidden="true"></span> Loading&hellip;</div>
  <iframe id="serviceFrame" title="Embedded service" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
</div>

<script>
  const icons = {
    lightning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
    terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 8 10 12 5 16"/><line x1="13" y1="16" x2="19" y2="16"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
    pulse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  };

  // key: used in the URL hash (#key) so a service view is linkable/back-button-able.
  // embed: false means the service is known to refuse being framed (its own
  // CSP/X-Frame-Options, or - Pi-hole here - unrelated port so no same-origin
  // exception applies either way); its card opens a normal new tab instead of
  // pretending to embed and showing a blocked/blank panel. See
  // stack-monitor/README.md and this file's README note for why each one.
  const services = [
    { key: 'rtl', name: 'RTL', desc: 'Lightning panel', icon: 'lightning', port: 3000, protocol: null, path: '', embed: true },
    { key: 'grafana', name: 'Grafana', desc: 'Metrics & dashboards', icon: 'chart', port: 4001, protocol: null, path: '', embed: true },
    { key: 'portainer', name: 'Portainer', desc: 'Container management', icon: 'box', port: 4000, protocol: 'https:', path: '', embed: false },
    { key: 'prometheus', name: 'Prometheus', desc: 'Time-series metrics', icon: 'pulse', port: 9090, protocol: null, path: '', embed: true },
    { key: 'ccr', name: 'CCR', desc: 'Claude Code Router', icon: 'terminal', port: 3458, protocol: null, path: '', embed: true },
    { key: 'pihole', name: 'Pi-hole', desc: 'DNS & ad blocking', icon: 'shield', port: 8081, protocol: null, path: '/admin', embed: false },
  ];
  const byKey = new Map(services.map((s) => [s.key, s]));

  const host = location.hostname;
  document.getElementById('host').textContent = host;

  function urlFor(svc) {
    const protocol = svc.protocol || location.protocol;
    return `${protocol}//${host}:${svc.port}${svc.path}`;
  }

  const externalIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  const grid = document.getElementById('grid');
  for (const svc of services) {
    const a = document.createElement('a');
    a.className = 'card';
    if (svc.embed) {
      a.href = `#${svc.key}`;
    } else {
      a.href = urlFor(svc);
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = 'Opens in a new tab (this service refuses to be framed)';
    }
    a.innerHTML = `
      <span class="icon">${icons[svc.icon]}</span>
      <span class="name">${svc.name}</span>
      <span class="desc">${svc.desc}</span>
      ${svc.embed ? '' : `<span class="ext" aria-hidden="true">${externalIcon}</span>`}
    `;
    grid.appendChild(a);
  }

  // Balance the grid instead of leaving whatever remainder auto-fill produces
  // (e.g. today's 6 cards at a common width naturally fit 4-per-row, so the
  // last row is a lonely 2). Derived from the actual card count every time,
  // not a number hardcoded for exactly 6 services, so it stays balanced as
  // services are added or removed.
  function balanceGridColumns() {
    const n = services.length;
    const style = getComputedStyle(grid);
    const minCard = 190, gap = parseFloat(style.gap) || 16;
    const containerWidth = grid.clientWidth || grid.parentElement.clientWidth;
    const fitCols = Math.max(1, Math.floor((containerWidth + gap) / (minCard + gap)));
    const maxCols = Math.min(fitCols, n);
    let best = maxCols, bestGap = Infinity;
    for (let c = maxCols; c >= 1; c--) {
      const leftover = (c - (n % c)) % c;   // empty slots in the last row at this column count
      if (leftover < bestGap) { bestGap = leftover; best = c; }
      if (bestGap === 0) break;             // a perfectly full grid - can't do better
    }
    grid.style.gridTemplateColumns = `repeat(${best}, minmax(${minCard}px, 1fr))`;
  }
  balanceGridColumns();
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(balanceGridColumns, 120);
  });

  const body = document.body;
  const crumb = document.getElementById('crumb');
  const openTab = document.getElementById('openTab');
  const frame = document.getElementById('serviceFrame');
  const frameStatus = document.getElementById('frameStatus');
  let loadTimer = null;

  function showHome() {
    body.classList.remove('in-service');
    crumb.innerHTML = '';
    openTab.href = '#';
    frame.src = 'about:blank';
    clearTimeout(loadTimer);
  }

  function showService(svc) {
    body.classList.add('in-service');
    crumb.innerHTML = `<span class="sep">/</span><span class="section">${svc.name} — ${svc.desc}</span>`;
    const target = urlFor(svc);
    openTab.href = target;
    frameStatus.classList.remove('hidden');
    frame.src = target;
    clearTimeout(loadTimer);
    // A frame blocked by the target's own X-Frame-Options/CSP still fires
    // "load" (browsers don't expose that failure across origins), so this
    // can only hide the spinner, never reliably detect a block - the
    // persistent "Open in new tab" button in the banner is the real escape
    // hatch for a service that refuses to be framed.
    loadTimer = setTimeout(() => frameStatus.classList.add('hidden'), 8000);
  }

  frame.addEventListener('load', () => {
    clearTimeout(loadTimer);
    frameStatus.classList.add('hidden');
  });

  function render() {
    const key = location.hash.slice(1);
    const svc = byKey.get(key);
    if (!svc) { showHome(); return; }
    // A hand-typed/bookmarked #key for a non-embeddable service (see the
    // `embed` note above `services`) gets sent straight to it instead of
    // faking an embedded view that would just show a blocked panel.
    if (!svc.embed) { location.replace(urlFor(svc)); return; }
    showService(svc);
  }

  document.getElementById('brand').addEventListener('click', () => {
    if (location.hash) location.hash = ''; else render();
  });
  window.addEventListener('hashchange', render);
  render();
</script>

</body>
</html>
