<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASTION Hub</title>
<style>
  :root {
    --bg: #0b0f14;
    --bg-card: #131920;
    --bg-card-hover: #1a222c;
    --border: #232c37;
    --text: #e8edf2;
    --text-dim: #8493a3;
    --accent: #f7931a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header .flag {
    font-size: 40px;
    line-height: 1;
  }

  header h1 {
    margin: 12px 0 4px;
    font-size: 26px;
    letter-spacing: 0.04em;
  }

  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  .grid {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
  }

  a.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 24px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }

  a.card:hover,
  a.card:focus-visible {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  a.card .icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }

  a.card .icon svg {
    width: 100%;
    height: 100%;
  }

  a.card .name {
    font-size: 15px;
    font-weight: 600;
  }

  a.card .desc {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  footer {
    margin-top: 48px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }

  footer code {
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="flag">🏴‍☠️</div>
  <h1>BASTION</h1>
  <p>Sovereign Node Infrastructure</p>
</header>

<div class="grid" id="grid"></div>

<footer>
  Connected as <code id="host"></code>
</footer>

<script>
  const icons = {
    lightning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
    pulse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  };

  const services = [
    { name: 'RTL', desc: 'Lightning panel', icon: 'lightning', port: 3000, protocol: null, path: '' },
    { name: 'Grafana', desc: 'Metrics & dashboards', icon: 'chart', port: 4001, protocol: null, path: '' },
    { name: 'Portainer', desc: 'Container management', icon: 'box', port: 4000, protocol: 'https:', path: '' },
    { name: 'Prometheus', desc: 'Time-series metrics', icon: 'pulse', port: 9090, protocol: null, path: '' },
    { name: 'Pi-hole', desc: 'DNS & ad blocking', icon: 'shield', port: 8081, protocol: null, path: '/admin' },
  ];

  const host = location.hostname;
  document.getElementById('host').textContent = host;

  const grid = document.getElementById('grid');
  for (const svc of services) {
    const protocol = svc.protocol || location.protocol;
    const url = `${protocol}//${host}:${svc.port}${svc.path}`;

    const a = document.createElement('a');
    a.className = 'card';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.innerHTML = `
      <span class="icon">${icons[svc.icon]}</span>
      <span class="name">${svc.name}</span>
      <span class="desc">${svc.desc}</span>
    `;
    grid.appendChild(a);
  }
</script>

</body>
</html>
