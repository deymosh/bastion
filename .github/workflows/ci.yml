name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE*", "**/.gitignore", "docs/**"]
  pull_request:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE*", "**/.gitignore", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static (lint + config invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck yamllint
      - run: bash tests/run.sh static

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: bash tests/run.sh unit

  integration:
    name: integration (tor reachability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - run: bash tests/run.sh integration
