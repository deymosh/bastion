name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
      - "**/.gitignore"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
      - "**/.gitignore"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: bash tests/shell-lint.sh

  config:
    name: config invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - run: bash tests/validate-config.sh

  refresher:
    name: ccr token refresher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test tests/ccr-refresher.test.mjs

  compose:
    name: compose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - run: bash tests/compose-lint.sh

  integration:
    name: hidden-service reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - run: bash tests/hidden-service-reachability.sh
