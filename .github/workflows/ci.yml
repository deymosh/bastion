name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE*", "**/.gitignore", "docs/**"]
  pull_request:
    branches: [master]
    paths-ignore: ["**/*.md", "LICENSE*", "**/.gitignore", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static (lint + config invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Install linters
        run: |
          # The runner image ships shellcheck; fall back to the release
          # tarball rather than apt (its third-party repos flake on Hash Sum).
          if ! command -v shellcheck >/dev/null; then
            curl -fsSLo /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
            echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/sc.tar.xz" | sha256sum -c -
            tar -xJf /tmp/sc.tar.xz && sudo mv shellcheck-v0.10.0/shellcheck /usr/local/bin/
          fi
          shellcheck --version
          pipx install yamllint
      - run: bash tests/run.sh static

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: bash tests/run.sh unit

  integration:
    name: integration (tor reachability)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - run: bash tests/run.sh integration

  agent-docker:
    # The one place the agent-docker isolation boundary is exercised for real:
    # Bastion's own installer puts Sysbox on the runner (checksum-verified,
    # Docker restarted), then the e2e runs with the privileged fallback
    # forbidden, so a sidecar that is not on sysbox-runc fails the job.
    name: integration (agent-docker on Sysbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Install Sysbox with utils/install-sysbox.sh
        run: bash utils/install-sysbox.sh
      - name: agent-docker end-to-end (Sysbox required)
        run: REQUIRE_SYSBOX=1 bash tests/integration/agent-docker.sh
