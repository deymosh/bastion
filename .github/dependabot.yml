# Proposes pin bumps as PRs; nothing is merged automatically. Bastion pins
# every pulled image as tag@sha256 - Dependabot rewrites tag and digest
# together, which is exactly the bump rule. Review each one like any other
# change to a node that holds funds; CI runs on every PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }

  # Pulled images in the compose files.
  - package-ecosystem: docker-compose
    directories:
      - /stack-network
      - /stack-bitcoin
      - /stack-monitor
      - /stack-web
      - /stack-ai
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      compose-images:
        patterns: ["*"]
    # The node itself is upgraded deliberately, never by a routine bot PR:
    # read the release notes, back up (docs/disaster-recovery.md), then bump
    # tag + digest by hand. Bitcoin Core majors can change pruning/index
    # behaviour or need a reindex.
    ignore:
      - dependency-name: "lncm/bitcoind"

  # Base images of the images Bastion builds.
  - package-ecosystem: docker
    directories:
      - /stack-network
      - /stack-bitcoin
      - /stack-ai/ccr
      - /stack-ai/mcp-gateway
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
    # Core Lightning migrates its wallet DB on first start - a one-way step -
    # and must be checked against the plugins built from pinned commits in
    # Dockerfile.lightningd. Upgrade it deliberately, not from a bot PR.
    ignore:
      - dependency-name: "elementsproject/lightningd"

  # The MCP gateway's pinned npm children (package-lock.json).
  - package-ecosystem: npm
    directory: /stack-ai/mcp-gateway
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
