# Proposes pin bumps as PRs; nothing is merged automatically. Bastion pins
# every pulled image as tag@sha256 - Dependabot rewrites tag and digest
# together, which is exactly the bump rule. Review each one like any other
# change to a node that holds funds; CI runs on every PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }

  # Pulled images in the compose files.
  - package-ecosystem: docker-compose
    directories:
      - /stack-network
      - /stack-bitcoin
      - /stack-monitor
      - /stack-web
      - /stack-ai
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      compose-images:
        patterns: ["*"]
        # Bitcoin Core never rides along in the routine group: it gets a PR of
        # its own. A major can change pruning/index behaviour or need a
        # reindex - read the release notes and back up before merging it.
        exclude-patterns: ["lncm/bitcoind"]

  # Base images of the images Bastion builds.
  - package-ecosystem: docker
    directories:
      - /stack-bitcoin
      - /stack-ai/ccr
      - /stack-ai/mcp-gateway
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
    # Ungrouped, so the Core Lightning base (Dockerfile.lightningd) always gets
    # a PR of its own. Its first start migrates the wallet DB one-way, and the
    # plugins pinned in the Dockerfile must support it: review before merging.

  # The MCP gateway's pinned npm children (package-lock.json).
  - package-ecosystem: npm
    directory: /stack-ai/mcp-gateway
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
