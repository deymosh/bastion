name: stack-ai

# Every service rotates its json-file log (3 x 10 MB): Docker's default is
# unbounded, which on an always-on node eventually fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ccr:
    build:
      context: ./ccr
      dockerfile: Dockerfile.ccr
      args:
        # Pin to a commit, not a moving ref. Bump to a newer release with
        # `gh api repos/musistudio/claude-code-router/commits/$(gh api repos/musistudio/claude-code-router/releases/latest --jq .tag_name) --jq .sha`
        # (the tags API isn't ordered by recency, so resolve via the actual
        # latest release instead of assuming `tags[0]` is newest).
        CCR_REF: 471e715c20cfa855c681f6d31dc652164d4fa654
    image: bastion-claude-code-router:471e715
    container_name: ccr
    logging: *logging
    restart: unless-stopped
    # ccr-entrypoint-wrapper.sh aligns ownership then gosu-drops to uid/gid 1000.
    # The added caps are only used at startup by the root wrapper (chown + the
    # priv drop); the long-running nginx/pm2/node processes hold none.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      # The wrapper starts as root, chowns the writable paths + data volume to
      # this uid/gid, then gosu-drops to it. Matches the ./data/ccr owner.
      PUID: ${USER_ID:-1000}
      PGID: ${GROUP_ID:-1000}
      CCR_GATEWAY_HOST: 0.0.0.0
      CCR_WEB_HOST: 127.0.0.1
      CCR_PUBLIC_HOST: 127.0.0.1
      CCR_PUBLIC_PORT: 3458
      # CCR_WEB_AUTH_TOKEN is NOT an env var - ccr-entrypoint-wrapper.sh exports
      # it from /run/secrets/ccr_web_auth_token (falls back to the env if set).
      CLAUDE_CONFIG_DIR: /data/.claude
      # OAuth token refresher (keeps .credentials.json fresh; no restart needed).
      CCR_TOKEN_REFRESH: ${CCR_TOKEN_REFRESH:-1}
      CCR_REFRESH_INTERVAL: ${CCR_REFRESH_INTERVAL:-300}
      CCR_REFRESH_SKEW_MS: ${CCR_REFRESH_SKEW_MS:-1800000}
    volumes:
      - ./data/ccr:/data
    secrets:
      - ccr_web_auth_token
    ports:
      - "3458:8080"
    networks:
      net:
        ipv4_address: 10.50.0.2

  codedeck-bridge:
    # Pinned by digest (version tag kept for readability). Pinned 2026-09-17.
    image: ghcr.io/deymosh/codedeck-plus-bridge:v0.12.0@sha256:960319b55c3a8287a524d7324228ea86e319e74fd4e824362d4faea0e410c911
    container_name: codedeck-bridge
    logging: *logging
    restart: unless-stopped
    depends_on:
      - ccr
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      GIT_USER: ${GIT_USER}
      GIT_EMAIL: ${GIT_EMAIL}
      GIT_REPO: ${GIT_REPO}
      CODEDECK_RELAYS: ${CODEDECK_RELAYS}
      CODEDECK_TOR_PROXY_URL: ${CODEDECK_TOR_PROXY_URL}
      # Claude Code Router (CCR) is the gateway to Claude Code. The bridge uses it to
      # discover available models and to proxy requests to the Claude Code API.
      ANTHROPIC_BASE_URL: http://ccr:8080
      CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: ${CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY:-1}
      # Optional OpenCode session backend (v0.12.0+). Empty/unset on every one
      # of these reproduces pre-v0.12.0 behaviour exactly - Claude Code only.
      CODEDECK_OPENCODE_SERVER_URL: ${CODEDECK_OPENCODE_SERVER_URL:-}
      CODEDECK_OPENCODE_AUTO_START: ${CODEDECK_OPENCODE_AUTO_START:-}
      CODEDECK_OPENCODE_PORT: ${CODEDECK_OPENCODE_PORT:-}
      # Optional GSD planning workflow (v0.12.0+); off by default
      # (CODEDECK_GSD_AUTO_INSTALL in docs/configuration.md).
      CODEDECK_GSD_AUTO_INSTALL: ${CODEDECK_GSD_AUTO_INSTALL:-}
      # Private Docker daemon from the opt-in agent-docker sidecar, over mutual
      # TLS. Harmless while the sidecar is off: its CLI volume is then empty,
      # so `docker` is simply not on PATH. PATH is the image's own plus the
      # sidecar-published CLI directory.
      DOCKER_HOST: tcp://agent-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/agent-docker/client
      PATH: /usr/local/libexec/docker/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    secrets:
      - source: claude_code_oauth_token
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: github_token
        uid: "1000"
        gid: "1000"
        mode: 0440
    volumes:
      - ./data/codedeck:/data
      # Both written by agent-docker (empty while it is off). The certs volume
      # holds the whole dind CA tree, but only client/ is readable by the
      # bridge's uid 1000: dind makes the client key 0644 on purpose and keeps
      # the CA and server keys 0600 root.
      - agent_docker_certs:/certs/agent-docker:ro
      - agent_docker_cli:/usr/local/libexec/docker:ro
    networks:
      net:
        ipv4_address: 10.50.0.3
      transit:

  agent-docker:
    # Opt-in (`./bastion up --with-agent-docker`): a private Docker daemon for
    # the codedeck-bridge agent, so it can `docker build` / `docker run` a
    # project's own toolchain container. Its containers, images and networks
    # live only inside this daemon - invisible to the host's Docker, so they
    # can never collide with or reach the Bastion containers.
    #
    # The isolation boundary is the Sysbox runtime: a user-namespaced "system
    # container" in which the stock dind image runs WITHOUT `privileged`
    # (container root maps to an unprivileged host uid). A privileged dind is
    # root on this host - the node holding the Lightning keys - so ./bastion
    # refuses to start this service unless sysbox-runc is installed, and there
    # is deliberately no privileged fallback. See docs/agent-docker.md.
    profiles: ["agent-docker"]
    # Pinned by digest (version tag kept for readability). Pinned 2026-09-26.
    image: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
    container_name: agent-docker
    logging: *logging
    # The dind entrypoint puts the hostname into the TLS server certificate's
    # SAN; it must equal the name in the bridge's DOCKER_HOST or every client
    # call fails verification.
    hostname: agent-docker
    runtime: sysbox-runc
    restart: unless-stopped
    # Publishes the CLI to the bridge, then execs the stock dockerd-entrypoint.sh.
    entrypoint: ["/bin/sh", "/opt/agent-docker/entrypoint.sh"]
    environment:
      # dind generates a CA + server/client certs here and listens on 2376 with
      # --tlsverify: a client without the CA-signed client cert is rejected.
      DOCKER_TLS_CERTDIR: /certs
    # Builds must not starve bitcoind / lightningd. Override in bastion.conf.
    cpus: ${AGENT_DOCKER_CPUS:-2}
    mem_limit: ${AGENT_DOCKER_MEMORY:-4g}
    pids_limit: 4096
    volumes:
      - ./agent-docker/entrypoint.sh:/opt/agent-docker/entrypoint.sh:ro
      - agent_docker_data:/var/lib/docker
      - agent_docker_certs:/certs
      - agent_docker_cli:/cli
      # The bridge's repositories, at the SAME path the bridge sees them, so a
      # `docker run -v /data/workspaces/<repo>:/src` from the agent resolves on
      # this daemon. Only workspaces/ is shared: the rest of the bridge's /data
      # (agent config and auth) stays out of reach of anything a build runs.
      # create_host_path: false - a missing dir must fail, not be created
      # root-owned (the bridge's uid 1000 could no longer clone into it);
      # ./bastion pre-creates it as the operator.
      - type: bind
        source: ./data/codedeck/workspaces
        target: /data/workspaces
        bind:
          create_host_path: false
    healthcheck:
      # Local unix socket inside the sidecar - no client cert needed.
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      net:
        ipv4_address: 10.50.0.6

  searxng:
    # Internal-only infrastructure for the gateway's searxng backend: no host
    # port is published and it is reachable only inside bastion-ai. JSON
    # output is enabled in ./config/searxng/settings.yml (mounted read-only) -
    # without it every mcp-searxng query answers 403.
    # Pinned by digest (date tag kept for readability). Pinned 2026-09-22.
    image: searxng/searxng:2026.9.21-df67eb6c2@sha256:1ef964f6dcc811a60e01049717b6e526b25a1c52935350143f04e0ae291b3dbd
    container_name: searxng
    logging: *logging
    restart: unless-stopped
    # Runs as the image's unprivileged "searxng" user (977) with no
    # capabilities; the writable paths it needs (/tmp) come from the tmpfs.
    user: "977:977"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Bind the directory, not the file: the image declares a VOLUME over
      # /etc/searxng, and a single-file bind under it is shadowed by the
      # anonymous volume (the settings would silently never load).
      - ./config/searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      net:
        ipv4_address: 10.50.0.4

  mcp-gateway:
    # Single MCP entry point for remote agents: the four stdio MCP servers
    # (searxng, context7, memory, time) run as children of this one container
    # and their tools are merged, namespaced (<namespace>_<tool>), and served
    # over Streamable HTTP at /mcp behind one Bearer token. See docs/mcp.md.
    # Built from a pinned package set (Dockerfile.mcp-gateway); no depends_on:
    # children are lazy and reconnect, so startup order never matters.
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile.mcp-gateway
    image: bastion-mcp-gateway:1.0.0
    container_name: mcp-gateway
    logging: *logging
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Secret values are NOT env vars: these are paths to /run/secrets files
      # the gateway reads at startup, plus plain non-secret settings.
      MCP_TOKEN_FILE: /run/secrets/mcp_gateway_token
      MCP_CONTEXT7_API_KEY_FILE: /run/secrets/context7_api_key
      MCP_SEARXNG_URL: http://searxng:8080
      MCP_MEMORY_FILE_PATH: /data/memory.json
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8811"
      TIMEZONE: ${TIMEZONE:-UTC}
    secrets:
      - source: mcp_gateway_token
        uid: "1000"
        gid: "1000"
        mode: 0440
      - source: context7_api_key
        uid: "1000"
        gid: "1000"
        mode: 0440
    volumes:
      # Knowledge-graph file for the memory server (named volume, not a bind:
      # it is owned by the container's uid 1000 from the image, not the host).
      - mcp_memory_data:/data
    ports:
      - "8811:8811"
    # Unauthenticated liveness endpoint (no token involved).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8811/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      net:
        ipv4_address: 10.50.0.5

# Derived from bastion.conf by ./bastion (utils/config.sh write_secret_files);
# git-ignored, mode 600. Delivered to the container as files under /run/secrets,
# never as plaintext env vars.
secrets:
  ccr_web_auth_token:
    file: ../secrets/ccr_web_auth_token
  claude_code_oauth_token:
    file: ../secrets/claude_code_oauth_token
  github_token:
    file: ../secrets/github_token
  mcp_gateway_token:
    file: ../secrets/mcp_gateway_token
  context7_api_key:
    file: ../secrets/context7_api_key

volumes:
  mcp_memory_data:
  # agent-docker: its image/container store, the dind TLS tree, and the CLI it
  # publishes to codedeck-bridge. `./bastion down` keeps them (no -v).
  agent_docker_data:
  agent_docker_certs:
  agent_docker_cli:

networks:
  net:
    name: bastion-ai
    ipam:
      config:
        - subnet: 10.50.0.0/24
  transit:
    name: bastion-transit
    external: true
