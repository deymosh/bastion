name: stack-bitcoin

# Every service rotates its json-file log (3 x 10 MB): Docker's default is
# unbounded, which on an always-on node eventually fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lightningd:
    image: lightningd-custom:latest
    build:
      context: .
      dockerfile: Dockerfile.lightningd
    container_name: lightningd
    logging: *logging
    restart: unless-stopped
    # docker stop -> the image entrypoint runs `lightning-cli stop` (clean
    # shutdown: plugins stopped, wallet DB and its backup-drive replica closed).
    # CLN finishes any startup chain catch-up before it honours a stop, which
    # took ~100s on a dev node syncing over explorers; Docker's default 10s
    # would SIGKILL it. Generous margin, like bitcoind's 5m.
    stop_grace_period: 3m
    # No depends_on bitcoind: the chain backend is trustedcoin (bcli disabled),
    # so CLN never queries bitcoind, and a hard dependency would make
    # `docker compose up lightningd` also start a full bitcoind sync - the one
    # thing the local-testing workflow must avoid. `./bastion up` still starts
    # bitcoind (it is in the stack) and waits for tor to be healthy first.
    volumes:
      # BACKUP - the separate drive CLN replicates its wallet DB to (wallet= in
      # config/cln_config). Same setting the daemon mirrors the SCB to, so the
      # two can never point at different places. Mount the drive BEFORE `up`:
      # a filesystem mounted on the host later stays invisible to the running
      # container, and CLN would keep writing to the node's own disk.
      - ${BACKUP_DEST:-/mnt/backup_cln}:/backup_usb
      # CONFIG & DATA
      - ./config/cln_config:/root/.lightning/config
      # peerswap reads <lightning-dir>/peerswap/peerswap.conf: Bitcoin swaps only
      # (see the file). Read-only and versioned here, like cln_config.
      - ./config/peerswap.conf:/root/.lightning/bitcoin/peerswap/peerswap.conf:ro
      - ./data/cln:/root/.lightning/bitcoin
      - tor-data:/data/.tor:ro
    ports:
      - "3001:3001"
    # RPC answers - the same call ./bastion and the daemon rely on.
    healthcheck:
      test: ["CMD", "lightning-cli", "getinfo"]
      interval: 30s
      timeout: 10s
      start_period: 5m   # RPC opens only after the initial chain catch-up
      retries: 3
    networks:
      net:
        ipv4_address: 10.20.0.2
      transit:
        # Pinned: CLN advertises this address to Tor as its hidden-service
        # forward target (see bind-addr in config/cln_config). It must be an
        # address the tor container can reach, i.e. on bastion-transit.
        ipv4_address: 10.254.0.10
    command:
      - --alias=${NODE_ALIAS}
      - --network=bitcoin
      - --log-level=info
      - --clboss-min-channel=1000000
      - --clboss-max-rebalance-fee-ppm=250
      - --clboss-auto-close=false

  bitcoind:
    # Version tag + digest. Pinned 2026-09-09.
    image: lncm/bitcoind:v28.0@sha256:1d335a5adbfac6d66cee20b62b339385819dc75f8cb60c6c5773922cec4c25ef
    container_name: bitcoind
    logging: *logging
    restart: unless-stopped
    user: "${USER_ID}:${GROUP_ID}"
    stop_grace_period: 5m  # Gives 5 minutes for graceful shutdown
    volumes:
      - ./data/bitcoin:/data/.bitcoin
    networks:
      net:
        ipv4_address: 10.20.0.3
      transit:
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -rpcuser=bitcoind.user -rpcpassword=bitcoind.pass -rpcport=8332 getblockchaininfo > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command:
      - -server=1
      - -dbcache=8000
      - -prune=20000        # This limits block storage to ~20GB
      - -txindex=0          # Saves space (not needed for CLN)
      - -printtoconsole=1
      - -proxy=tor:9050     # Route all P2P traffic through Tor (resolved on bastion-transit)
      - -listen=0           # Disable incoming P2P connections
      - -rpcuser=bitcoind.user      # Put the user you want
      - -rpcpassword=bitcoind.pass  # Put the password you want
      - -rpcallowip=10.20.0.0/24
      - -rpcbind=0.0.0.0

  rtl:
    # Version tag + digest. Pinned 2026-09-09.
    image: shahanafarooqui/rtl:v0.15.12@sha256:47bc963a983aba9eb8961603fd57ce89f20c0df15438450e9639c0265c364c3b
    container_name: rtl
    logging: *logging
    restart: unless-stopped
    depends_on:
      - lightningd
    environment:
      - RTL_CONFIG_PATH=/data
    volumes:
      - ./data/rtl:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/rtl/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      net:
        ipv4_address: 10.20.0.4

  teosd:
    image: teosd:latest
    container_name: teosd
    logging: *logging
    restart: unless-stopped
    # Opt-in: running your OWN watchtower for other nodes is not the default.
    # `./bastion up --with-watchtower` (or BASTION_PROFILES=watchtower) starts it.
    # The CLN `watchtower-client` plugin - breach protection FOR this node,
    # pointed at an external tower - is unrelated and always on.
    profiles: ["watchtower"]
    depends_on:
      bitcoind:
        condition: service_healthy
    volumes:
      - ./data/teos:/home/teos/.teos
      - tor-data:/data/.tor:ro
    command: ["teosd"]
    networks:
      net:
        ipv4_address: 10.20.0.5
      transit:
        # Pinned: teosd binds its API here and advertises it to Tor as the
        # watchtower hidden-service forward target (see api_bind in
        # config/teos.toml). Must be reachable from the tor container.
        ipv4_address: 10.254.0.11

networks:
  net:
    name: bastion-bitcoin
    ipam:
      config:
        - subnet: 10.20.0.0/24
  transit:
    name: bastion-transit
    external: true

volumes:
  tor-data:
    name: bastion-tor-data
    external: true
