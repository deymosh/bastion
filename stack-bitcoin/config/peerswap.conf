# PeerSwap plugin config (TOML). Mounted read-only at
# /root/.lightning/bitcoin/peerswap/peerswap.conf, where the plugin looks for it.
# Reference: https://github.com/ElementsProject/peerswap/blob/master/docs/setup_cln.md
#
# Bastion runs Bitcoin (on-chain BTC) swaps only. There is no Elements/Liquid
# node here, so L-BTC swaps are switched off explicitly instead of leaving the
# plugin to go looking for an Elements cookie that never exists.
#
# Only set the swap toggles. Any rpc* key in [Bitcoin] replaces the bitcoind
# RPC settings peerswap otherwise takes from cln_config (bitcoin-rpc*), so
# leave them out.

[Bitcoin]
bitcoinswaps = true   # BTC on-chain swaps

[Liquid]
liquidswaps = false   # no Elements node: L-BTC swaps disabled
